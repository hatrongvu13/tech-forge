syntax = "proto3";

package htv.identity.v1;

option java_multiple_files = true;
option java_package = "com.htv.contract.identity.v1";

// Service đăng ký danh mục quyền của mình với identity lúc khởi động (xem thiết kế mục 3.5).
service PermissionCatalogService {
  // Idempotent. Identity lấy tên service từ chứng chỉ mTLS, không tin service_name trong thân (trừ cờ dev).
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message PermissionDef {
  string code = 1;         // dạng <miền>:<hành động>, ví dụ order:read
  string description = 2;
}

message RegisterRequest {
  string service_name = 1;
  string service_version = 2;
  string instance_id = 3;
  repeated PermissionDef permissions = 4;
}

message RejectedCode {
  string code = 1;
  string reason = 2;  // OWNED_BY_OTHER | INVALID_FORMAT
}

message RegisterResponse {
  int32 created = 1;
  int32 updated = 2;
  int32 unchanged = 3;
  repeated RejectedCode rejected = 4;
}
