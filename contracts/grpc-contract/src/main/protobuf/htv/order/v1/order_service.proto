syntax = "proto3";

package htv.order.v1;

option java_multiple_files = true;
option java_package = "com.htv.contract.order.v1";

// Contract mẫu. Quy ước: mỗi domain một thư mục htv/<domain>/v<major>/, đổi breaking = tạo v2.
service OrderService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  string order_id = 1;
  string status = 2;
}
